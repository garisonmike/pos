name: Android release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Build and sign APK
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Drift code
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode release keystore
        env:
          POS_ANDROID_KEYSTORE_BASE64: ${{ secrets.POS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${POS_ANDROID_KEYSTORE_BASE64:?Missing POS_ANDROID_KEYSTORE_BASE64 Actions secret}"
          keystore="$RUNNER_TEMP/pos-production-release.jks"
          printf '%s' "$POS_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "POS_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: mobile
        env:
          POS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.POS_ANDROID_KEYSTORE_PASSWORD }}
          POS_ANDROID_KEY_ALIAS: ${{ secrets.POS_ANDROID_KEY_ALIAS }}
          POS_ANDROID_KEY_PASSWORD: ${{ secrets.POS_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${POS_ANDROID_KEYSTORE_PASSWORD:?Missing POS_ANDROID_KEYSTORE_PASSWORD Actions secret}"
          : "${POS_ANDROID_KEY_ALIAS:?Missing POS_ANDROID_KEY_ALIAS Actions secret}"
          : "${POS_ANDROID_KEY_PASSWORD:?Missing POS_ANDROID_KEY_PASSWORD Actions secret}"
          flutter build apk --release

      - name: Verify APK signature
        env:
          APK_PATH: mobile/build/app/outputs/flutter-apk/app-release.apk
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          test -s "$APK_PATH"
          "$apksigner" verify --verbose "$APK_PATH"
          "$apksigner" verify --print-certs "$APK_PATH"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-signed-apk-${{ github.ref_name }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pos-production-release.jks"

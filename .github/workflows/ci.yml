# Every push and every pull request runs everything.
#
# There is no fast lane and no deferred set, because there is nothing to defer:
# the backend suite is 1328 tests in about 100 seconds and the Dart suite is
# 224 in about 35.
#
# It is worth recording why that needed saying. This pipeline was first built
# around a 29-minute suite, sharded four ways to make the wait bearable. The 29
# minutes turned out to be a misconfiguration - docker compose exports
# DJANGO_SETTINGS_MODULE=config.settings.dev, that beat the setting in
# pyproject.toml, and the suite had been running under development settings
# with the real password hasher instead of the test one. Fixing that (the --ds
# flag in addopts) took the run from 29 minutes to under two, and the sharding,
# the shard-coverage guard and the nightly reference run all stopped earning
# their complexity. They were deleted rather than kept for a problem that no
# longer exists.
#
# Backend jobs go through `docker compose` rather than an Actions service
# container, and that part is deliberate. Django must connect as the
# NOSUPERUSER NOBYPASSRLS role created by docker/postgres/init: Postgres
# exempts superusers from Row-Level Security, so a service container on the
# default superuser would let every tenant-isolation test pass while proving
# nothing.

name: CI

on:
  push:
  pull_request:

concurrency:
  # A new push supersedes the one before it on the same branch. Nothing is
  # learned by finishing a run against code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          cp .env.example .env
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
          } >> .env

      - name: Build the API image
        run: docker compose build api

      - name: Start Postgres and Redis
        run: docker compose up -d db cache

      # No settings module passed: pyproject.toml's addopts pins it with --ds,
      # and config/settings/test.py carries everything the boot checks need, so
      # this runs the same way from a clean checkout as it does on a laptop.
      - name: Test
        run: docker compose run --rm -T api pytest -q

      # config/settings/production.py is imported by nothing in the suite, so
      # without this a typo in it is found during a deploy. security.W008 is
      # expected and deliberate - Caddy redirects HTTP to HTTPS before Django
      # sees a request, and enabling SECURE_SSL_REDIRECT would break the
      # container healthcheck, which speaks plain HTTP internally.
      #
      # These values are placeholders that satisfy the boot checks. They prove
      # the module imports and its checks run, not that any real deployment is
      # configured correctly; DEPLOYMENT.md covers that.
      - name: Production settings load
        run: |
          docker compose run --rm -T \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e DJANGO_ALLOWED_HOSTS=pos.example.com \
            -e DJANGO_SECRET_KEY=qX7x2X4wKvR9tHmZ3bNpL8sJdF6yG1cQaE5uT0iYoP7rW9zVxB \
            -e TRUSTED_PROXY_HOPS=1 \
            -e PLATFORM_ADMIN_URL=ops-ci-4d19b/ \
            api python manage.py check --deploy

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100 db cache

  checks:
    name: Lint, migrations, Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      # `ruff check` only. Not `ruff format --check`: this codebase has never
      # been run through ruff's formatter, and turning it on would fail every
      # build until 93 files were reformatted. That is a decision to take on
      # its own, in its own commit - not a side effect of adding CI.
      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Environment
        run: |
          cp .env.example .env
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
          } >> .env

      # Postgres is up for the drift check below. Without it makemigrations
      # cannot read migration history and degrades to a warning, which is a
      # check that reports success without having done its job.
      - name: Start Postgres
        run: docker compose up -d db

      # Catches a model changed without its migration. The failure it prevents
      # is a deploy that migrates to the wrong shape.
      - name: Migration drift
        run: |
          docker compose run --rm -T \
            -e DJANGO_SETTINGS_MODULE=config.settings.test \
            --entrypoint python api manage.py makemigrations --check --dry-run

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      # drift generates database.g.dart, and *.g.dart is gitignored - so a
      # clean checkout has the drift table definitions but none of the code
      # they generate, and analyze fails on a hundred undefined names. It works
      # on a laptop only because the file is already sitting there from the
      # last build. This is the step that makes a fresh clone behave like one.
      - name: Generate drift code
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      # All 224 of them, in about 35 seconds.
      - name: Flutter tests
        working-directory: mobile
        run: flutter test

# What does not belong on a push.
#
# CI runs the whole suite on every push in a couple of minutes, so this is not
# "the slow half". It is the two things that are genuinely not per-commit work:
# compiling the app for real targets, and coverage as a trend.
#
# A failure here is not a broken build. It means something drifted that the
# per-push run is not shaped to notice.

name: Nightly

on:
  schedule:
    # 02:15 UTC, which is 05:15 in Nairobi - after the overnight and before
    # anybody opens a till.
    - cron: "15 2 * * *"
  # Runnable by hand, because a nightly nobody can trigger is a nightly nobody
  # debugs.
  workflow_dispatch:

jobs:
  # ---- The app compiles, not just tests ---------------------------------
  #
  # `flutter test` runs against the Dart VM and never invokes the Android or
  # Linux toolchains. A Gradle or CMake break is invisible until somebody tries
  # to build a release - which, on this project, is the day it goes to a shop.
  builds:
    name: Release build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [apk, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"

      - name: Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: mobile
        run: flutter pub get

      # Unsigned. This asks whether it compiles, not whether it is shippable -
      # signing keys are Spiderman's to hold and are not in this repository.
      - name: Build
        working-directory: mobile
        run: flutter build ${{ matrix.target }} --release

  # ---- Coverage ---------------------------------------------------------
  #
  # A number to read as a trend, deliberately not a gate. A coverage threshold
  # on a suite like this one mostly teaches people to write tests that execute
  # lines without asserting anything.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          cp .env.example .env
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
          } >> .env

      - name: Start Postgres and Redis
        run: docker compose up -d db cache

      - name: Test with coverage
        run: |
          docker compose run --rm -T api \
            pytest -q --cov=apps --cov-report=term --cov-report=html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: backend/htmlcov/
          retention-days: 14

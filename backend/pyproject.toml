[project]
name = "pos-backend"
version = "0.1.0"
description = "Multi-tenant point of sale platform API"
requires-python = ">=3.13"

dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<0.29",
    "psycopg[binary]>=3.2,<4",
    "django-environ>=0.12,<0.13",
    "django-filter>=25.1",
    "django-cors-headers>=4.7,<5",
    # Django's built-in Redis backend needs the client library; django-redis is
    # not used, so there is one fewer layer between settings and the server.
    "redis>=5.2,<6",
    # Required by ImageField, which validates that an upload is really an image
    # rather than trusting its extension.
    "Pillow>=11.0,<12",
    # Fernet, for encrypting each tenant's Daraja credentials at rest.
    "cryptography>=44.0",
    # Receipt PDFs. Chosen over WeasyPrint because a receipt is a narrow column
    # of text and does not need a browser engine's layout - nor the system
    # libraries one would drag into the image.
    "reportlab>=4.2,<5",
    # The production application server. runserver is single-threaded, reloads
    # on file changes and says so itself - it is not a deployment target.
    "gunicorn>=23.0,<24",
    # Daraja calls. Synchronous and short-lived, so a plain client is enough.
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.9",
]

[tool.setuptools]
# The project is a Django app tree rather than an installable library; this
# keeps `pip install -e .` from trying to auto-discover packages and failing.
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps"]
# --ds, not just the DJANGO_SETTINGS_MODULE above, and the difference matters.
# docker compose exports DJANGO_SETTINGS_MODULE=config.settings.dev into the
# container, and that environment variable beats the ini setting - so for six
# milestones the whole suite ran under development settings without saying so.
# It cost 29 minutes a run instead of two (the real password hasher rather than
# the test one), left the cache pointed at a shared Redis, and left throttles
# on. --ds is passed as a command-line option, which wins over the environment.
addopts = "--strict-markers -ra --ds=config.settings.test"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = [
    # Django models legitimately lack __str__ ordering concerns handled elsewhere.
    "DJ001",
]

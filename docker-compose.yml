# Single documented route for running this project.
#
#   cp .env.example .env && docker compose up
#
# That brings up Postgres, applies migrations, seeds a platform admin and
# starts the API. There is no separate "run it without Docker" path on purpose:
# the tenant isolation guarantees depend on Django connecting as a specific
# non-superuser role, and that setup is easy to get subtly wrong by hand.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by the init script to create the application role.
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Postgres 18 images store data in a major-version subdirectory, so the
      # mount goes at /var/lib/postgresql rather than the /data path that
      # earlier versions used. Mounting the old path makes the container refuse
      # to start.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Exposed for inspection with psql from the host. Not required by the app.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    # Redis holds two things, both of which must survive an API restart but
    # neither of which is worth persisting to disk: the per-business
    # active/suspended status, and the failed-PIN counters behind till lockout.
    # Losing the lot on a restart costs one extra status query per business and
    # forgives any attempt counters mid-flight, so persistence is off.
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    # Run as the host user so files the container writes into the bind mount -
    # generated migrations especially - are owned by you and not by root.
    user: "${UID:-1000}:${GID:-1000}"
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_URL: ${REDIS_URL}
      PIN_LOCKOUT_MAX_ATTEMPTS: ${PIN_LOCKOUT_MAX_ATTEMPTS}
      PIN_LOCKOUT_SECONDS: ${PIN_LOCKOUT_SECONDS}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS}
      PLATFORM_ADMIN_URL: ${PLATFORM_ADMIN_URL}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  postgres_data:
